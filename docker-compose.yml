# Coolify / Docker : l'app écoute sur 3000 (port par défaut Coolify/Traefik).
# Réseau `coolify` : obligatoire pour joindre une DB Coolify (hostname = UUID).
services:
  app:
    build: .
    image: communaute-bapa:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - coolify

networks:
  coolify:
    external: true
